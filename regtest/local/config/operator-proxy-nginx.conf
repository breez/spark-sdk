# The operators serve TLS only. Wallets reach them here over plain HTTP, native
# gRPC and gRPC-Web on the same port, and nginx carries on to the operator over
# TLS.
resolver 127.0.0.11 valid=10s;

map $server_port $operator {
    8535 spark-so-0:8535;
    8536 spark-so-1:8535;
    8537 spark-so-2:8535;
}

server {
    listen 8535;
    listen 8536;
    listen 8537;
    http2 on;

    client_max_body_size 0;
    # A wallet's event stream stays open for as long as the wallet runs.
    grpc_read_timeout 1d;
    grpc_send_timeout 1d;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;

    location / {
        if ($content_type ~* "^application/grpc($|[+;])") {
            grpc_pass grpcs://$operator;
        }
        proxy_pass https://$operator;
        proxy_http_version 1.1;
        proxy_buffering off;
    }
}
