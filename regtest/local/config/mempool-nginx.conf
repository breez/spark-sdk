# One origin for the explorer and the API, laid out as mempool.space's. In
# esplora mode the backend serves only /api/v1, and electrs the rest of /api.
server {
    listen 80;

    location /api/v1/ws {
        proxy_pass http://mempool-api:8999;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/v1/ {
        proxy_pass http://mempool-api:8999/api/v1/;
    }

    location /api/ {
        proxy_pass http://electrs:3002/;
    }

    location / {
        proxy_pass http://mempool-web:8080;
    }
}
