[package]
name = "breez_sdk_spark_flutter"
version = "0.1.0"
edition = "2024"

[workspace]

# Own workspace, so the root release profile does not apply here. Mirrors its
# size settings but keeps unwinding: flutter_rust_bridge turns a Rust panic into
# a Dart exception, which `panic = "abort"` would replace with a crash.
[profile.release]
lto = true
opt-level = "z"
codegen-units = 1

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.88"
# Replaced with release commit during publishing
breez-sdk-spark = { path = "../../../crates/breez-sdk/core", features = [
    "passkey",
    "sqlite",
] }
extend = "1.2.0"
flutter_rust_bridge = "=2.13.0"
futures = { version = "0.3", default-features = false, features = ["alloc"] }

[features]
# See breez-sdk-spark's `secp-lowmemory` feature.
secp-lowmemory = ["breez-sdk-spark/secp-lowmemory"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
