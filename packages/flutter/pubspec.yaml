name: breez_sdk_spark_flutter
description: Flutter bindings for the Breez Spark SDK
version: 0.1.0
homepage: https://breez.technology
repository: https://github.com/breez/breez-sdk-spark-flutter
publish_to: 'none'

environment:
  sdk: ^3.10.0 # Native asset build hooks need Dart 3.10 (Flutter 3.38)
  flutter: ">=3.38.0"

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

dependencies:
  code_assets: ^2.2.0
  crypto: ^3.0.8
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  hooks: ^2.2.0

flutter:
  plugin:
    platforms:
      android:
        package: technology.breez.spark
        pluginClass: BreezSdkSparkPasskeyPlugin
      ios:
        pluginClass: BreezSdkSparkPasskeyPlugin

# Applies only when this package is the root, for its own tests: a dev build
# of the host library is much faster than the release profile.
hooks:
  user_defines:
    breez_sdk_spark_flutter:
      cargo_profile: dev
