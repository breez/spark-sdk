name: 'Setup build environment'
description: 'Sets up dependencies for the build environment'
inputs:
  github-token:
    description: 'github token'
    required: true
  rust-cache-shared-key:
    description: 'Another job whose Rust cache to use instead of one of its own'
    required: false
    default: ''
  rust-cache-save:
    description: 'Whether to save the Rust cache'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Install Protoc
      uses: arduino/setup-protoc@v3
      with:
        version: "30.2"
        repo-token: ${{ inputs.github-token }}

    # Shortens the absolute source paths that panic locations embed in the iOS
    # and Android libraries (about 80 KB each). Per-target variables merge with
    # the rustflags in `.cargo/config.toml`, where `RUSTFLAGS` would replace
    # them. Set before the Rust cache so its key covers them.
    - name: Remap source paths for mobile targets
      shell: bash
      run: |
        cargo_home="${CARGO_HOME:-$HOME/.cargo}"
        # The last matching prefix wins, so the full registry path goes last. Its
        # hash can change with cargo versions, leaving only the shorter generic
        # prefix. Cargo's `trim-paths` profile option (unstable) remaps all of
        # this on its own: switch to it once it is stable.
        flags="--remap-path-prefix=$cargo_home/registry/src/="
        flags="$flags --remap-path-prefix=$cargo_home/registry/src/index.crates.io-1949cf8c6b5b557f/="
        flags="$flags --remap-path-prefix=$cargo_home/git/checkouts/="
        flags="$flags --remap-path-prefix=$GITHUB_WORKSPACE/="
        for target in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios \
            aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
          echo "CARGO_TARGET_$(echo "$target" | tr 'a-z-' 'A-Z_')_RUSTFLAGS=$flags" >> "$GITHUB_ENV"
        done

    - name: Setup rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.rust-cache-shared-key }}
        save-if: ${{ inputs.rust-cache-save }}
