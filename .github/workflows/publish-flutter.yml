name: Publish Flutter Bindings
on:
  workflow_call:
    inputs:
      repository:
        description: 'SDK repository, defaults to current repository'
        required: false
        type: string
      ref:
        description: 'Git commit, tag or branch reference'
        required: true
        type: string
      package-version:
        description: 'Version for the Flutter package (MAJOR.MINOR.PATCH) // (no v prefix)'
        required: true
        type: string
      publish:
        description: 'Should publish the package'
        required: true
        type: boolean
        default: false
    secrets:
      REPO_SSH_KEY:
        description: 'SSH key to commit to the breez-sdk-spark-flutter repository'
        required: true
      FLUTTER_RELEASE_TOKEN:
        description: 'GitHub token to release to the breez-sdk-spark-flutter repository'
        required: true

# The package's build hook downloads each target's libraries from the GitHub
# release of the package version, checking them against hook/prebuilt.json.
# The SDK libraries come from the build-bindings-* jobs of the calling
# workflow. The callback relay library is generated with the Dart bindings, so
# it is built here.
env:
  FLUTTER_VERSION: '3.47.4'
  FLUTTER_PACKAGE_REPO: 'breez/breez-sdk-spark-flutter'

jobs:
  codegen:
    name: Generate Dart bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup build
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache uniffi_bindgen_dart
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/uniffi_bindgen_dart
          key: uniffi-bindgen-dart-${{ runner.os }}-${{ hashFiles('crates/breez-sdk/bindings/Makefile') }}

      - name: Install uniffi_bindgen_dart
        run: command -v uniffi_bindgen_dart || make -C crates/breez-sdk/bindings install-uniffi-bindgen-dart

      # Builds the host library with the mobile feature set, whose metadata
      # matches the shipped libraries.
      - name: Generate bindings
        working-directory: packages/flutter
        run: just codegen

      - name: Archive generated bindings
        uses: actions/upload-artifact@v4
        with:
          name: flutter-generated
          path: |
            packages/flutter/lib/src/generated
            packages/flutter/native/dispatch

  build-relay:
    name: Build relay ${{ matrix.target }}
    needs: codegen
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { target: aarch64-linux-android, runner: ubuntu-latest }
          - { target: armv7-linux-androideabi, runner: ubuntu-latest }
          - { target: x86_64-linux-android, runner: ubuntu-latest }
          - { target: aarch64-apple-ios, runner: macos-latest }
          - { target: aarch64-apple-ios-sim, runner: macos-latest }
          - { target: x86_64-apple-ios, runner: macos-latest }
          - { target: aarch64-apple-darwin, runner: macos-latest }
          - { target: x86_64-apple-darwin, runner: macos-latest }
    steps:
      # The workspace's .cargo/config.toml sets the Android link flags.
      - name: Checkout SDK Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: flutter-generated
          path: generated

      - name: Install target
        run: |
          rustup target add ${{ matrix.target }}
          if [[ "${{ matrix.target }}" == *android* ]]; then cargo install cargo-ndk; fi

      - name: Build relay library
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '15.0'
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: |
          manifest=generated/native/dispatch/Cargo.toml
          if [[ "${{ matrix.target }}" == *android* ]]; then
            cargo ndk -t ${{ matrix.target }} -P 24 build --release --manifest-path $manifest --target-dir target
          else
            cargo build --release --manifest-path $manifest --target ${{ matrix.target }} --target-dir target
          fi
          mkdir -p dist
          cp target/${{ matrix.target }}/release/libbreez_sdk_spark_bindings_dart_dispatch.{so,dylib} dist/ 2>/dev/null || true
          ls dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: flutter-relay-${{ matrix.target }}
          path: dist/*

  build-package:
    name: Build Flutter Package
    needs: build-relay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Flutter Package Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FLUTTER_PACKAGE_REPO }}
          ssh-key: ${{ secrets.REPO_SSH_KEY }}
          fetch-depth: 0
          path: dist

      - name: Checkout SDK Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          path: build

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: flutter-generated
          path: build/packages/flutter

      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          pattern: flutter-relay-*
          path: artifacts

      # Each library is gzipped as lib<name>-<target>.<ext>.gz and listed with
      # its sha256 in hook/prebuilt.json, which the build hook reads.
      - name: Collect release libraries
        run: |
          mkdir -p release
          python3 - <<'EOF'
          import gzip, hashlib, json, os, shutil
          version = "${{ inputs.package-version }}"
          targets = {
              "aarch64-linux-android": "so", "armv7-linux-androideabi": "so", "x86_64-linux-android": "so",
              "aarch64-apple-ios": "dylib", "aarch64-apple-ios-sim": "dylib", "x86_64-apple-ios": "dylib",
              "aarch64-apple-darwin": "dylib", "x86_64-apple-darwin": "dylib",
          }
          libraries = {
              "uniffi:breez_sdk_spark_bindings": ("breez_sdk_spark_bindings", lambda t, ext: (
                  f"artifacts/bindings-{t}" if ext == "so" else f"artifacts/bindings-dynamic-{t}")),
              "uniffi:breez_sdk_spark_bindings_dispatch": ("breez_sdk_spark_bindings_dart_dispatch",
                  lambda t, ext: f"artifacts/flutter-relay-{t}"),
          }
          manifest = {
              "base_url": f"https://github.com/${{ env.FLUTTER_PACKAGE_REPO }}/releases/download/v{version}/",
              "targets": {},
          }
          for target, ext in targets.items():
              entry = manifest["targets"][target] = {}
              for asset, (name, directory) in libraries.items():
                  source = os.path.join(directory(target, ext), f"lib{name}.{ext}")
                  file = f"lib{name}-{target}.{ext}.gz"
                  with open(source, "rb") as src, gzip.GzipFile(os.path.join("release", file), "wb", mtime=0) as dst:
                      shutil.copyfileobj(src, dst)
                  with open(os.path.join("release", file), "rb") as f:
                      entry[asset] = {"file": file, "sha256": hashlib.sha256(f.read()).hexdigest()}
          with open("build/packages/flutter/hook/prebuilt.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          EOF
          ls -la release

      - name: Prepare Package Structure
        working-directory: dist
        run: |
          # Remove what earlier package layouts shipped
          rm -rf android cargokit ios macos lib rust hook native test Makefile cargokit_options.yaml flutter_rust_bridge.yaml

          cp -r ../build/packages/flutter/{android,ios,lib,hook} .
          rm -f lib/src/.gitignore
          cp ../build/packages/flutter/{pubspec.yaml,analysis_options.yaml} .

      - name: Copy Documentation
        working-directory: dist
        run: |
          for file in CHANGELOG.md LICENSE README.md; do
            [ -f "../build/packages/flutter/$file" ] && cp "../build/packages/flutter/$file" . || echo "Warning: $file not found"
          done

      - name: Update Package Version to Release Version
        working-directory: dist
        run: |
          sed -i -e 's/^version:.*/version: ${{ inputs.package-version }}/' pubspec.yaml
          sed -i -e "s/^version .*/version '${{ inputs.package-version }}'/" android/build.gradle
          # CocoaPods won't resolve a pre-release version for a local pod, so
          # the podspec drops any suffix such as `-dryrun`.
          POD_VERSION="${{ inputs.package-version }}"
          POD_VERSION="${POD_VERSION%%[-+]*}"
          sed -i -E "s/^([ ]*spec\.version[ ]*=[ ]*).*/\1\"$POD_VERSION\"/" ios/breez_sdk_spark_flutter.podspec

      - name: Analyze Package
        working-directory: dist
        run: |
          flutter pub get
          dart analyze --fatal-infos lib hook

      - name: Archive Flutter Package
        uses: actions/upload-artifact@v4
        with:
          name: breez-sdk-spark-flutter-${{ inputs.package-version || github.sha }}
          path: |
            dist/*
            !dist/.git
            !dist/.dart_tool
            !dist/pubspec.lock
          retention-days: 30
          compression-level: 9

      - name: Archive Release Libraries
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-libraries
          path: release/*
          retention-days: 30

  verify:
    name: Verify package (${{ matrix.os }})
    needs: build-package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: breez-sdk-spark-flutter-${{ inputs.package-version || github.sha }}
          path: package

      - uses: actions/download-artifact@v4
        with:
          name: flutter-release-libraries
          path: libraries

      # An app that depends on the package and takes its libraries from
      # prebuilt_dir, the same files the release will host.
      - name: Build an app with the package
        run: |
          flutter create --platforms android,ios,macos verify_app
          cd verify_app
          flutter pub add "breez_sdk_spark_flutter:{\"path\":\"$GITHUB_WORKSPACE/package\"}"
          cat >> pubspec.yaml <<EOF

          hooks:
            user_defines:
              breez_sdk_spark_flutter:
                prebuilt_dir: $GITHUB_WORKSPACE/libraries
          EOF
          cat > lib/main.dart <<'EOF'
          import 'package:breez_sdk_spark_flutter/breez_sdk_spark.dart';
          import 'package:flutter/widgets.dart';

          void main() {
            final config = defaultConfig(network: Network.regtest);
            runApp(Text('${config.network}', textDirection: TextDirection.ltr));
          }
          EOF
          if [ "$RUNNER_OS" = "Linux" ]; then
            flutter build apk --release
          else
            flutter build ios --simulator --debug
            flutter build ios --release --no-codesign
            flutter build macos --release
          fi

  publish:
    name: Publish Flutter Package
    needs: verify
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Flutter Package Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FLUTTER_PACKAGE_REPO }}
          ssh-key: ${{ secrets.REPO_SSH_KEY }}
          fetch-depth: 0
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: breez-sdk-spark-flutter-${{ inputs.package-version || github.sha }}
          path: package

      - uses: actions/download-artifact@v4
        with:
          name: flutter-release-libraries
          path: release

      - name: Commit the package
        working-directory: dist
        run: |
          git config user.name "Breez SDK Bot"
          git config user.email "sdk-bot@breez.technology"

          # The archive holds no dotfiles, so the repository's own stay.
          rm -rf android cargokit ios macos lib rust hook native test Makefile cargokit_options.yaml flutter_rust_bridge.yaml
          cp -r ../package/. .

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: release Flutter package v${{ inputs.package-version }}"
            git push
          fi

      # The release creates the tag, so the tag never points at a prebuilt.json
      # whose libraries aren't uploaded yet.
      - name: Create the release with the libraries
        env:
          GH_TOKEN: ${{ secrets.FLUTTER_RELEASE_TOKEN }}
        run: |
          gh release create "v${{ inputs.package-version }}" release/* \
            --target "$(git -C dist rev-parse HEAD)" \
            --repo ${{ env.FLUTTER_PACKAGE_REPO }} \
            --title "v${{ inputs.package-version }}" \
            --notes "Native libraries for breez_sdk_spark_flutter ${{ inputs.package-version }}."

      # Download every library the way the build hook does and check it.
      - name: Check the released libraries
        run: |
          python3 - <<'EOF'
          import hashlib, json, urllib.request
          manifest = json.load(open("package/hook/prebuilt.json"))
          for target, entry in manifest["targets"].items():
              for asset, file in entry.items():
                  data = urllib.request.urlopen(manifest["base_url"] + file["file"]).read()
                  actual = hashlib.sha256(data).hexdigest()
                  assert actual == file["sha256"], f"{file['file']}: {actual} != {file['sha256']}"
                  print("ok", file["file"])
          EOF
