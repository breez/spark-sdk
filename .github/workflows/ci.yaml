name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
        triggered_by:
          description: Who triggered this run
          required: false
          default: manual

run-name: ${{ inputs.triggered_by != '' && format('CI triggered by {0}', inputs.triggered_by) || github.event.head_commit.message || github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The CLI's `fido2` feature pulls in hidapi, whose build script needs
      # libudev on Linux.
      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Run Clippy
        run: make cargo-clippy-check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Format Check
        run: make fmt-check

  passkey-core-sync:
    name: Passkey core sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify CredentialManagerPrfCore copies are in sync
        run: cargo xtask sync-passkey-core --check

  ios-cocoapods-compile:
    name: iOS CocoaPods compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Only Flutter.xcframework is needed, so this job skips setup-build.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4

      - name: Fetch Flutter iOS artifacts
        run: flutter precache --ios

      - name: Typecheck Flutter & React Native iOS sources as CocoaPods builds them
        run: ./scripts/check-ios-cocoapods.sh

  rn-post-ubrn-check:
    name: RN post-ubrn sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify post-ubrn patches are in sync
        working-directory: packages/react-native
        run: node ./scripts/post-ubrn.js --check

  rn-expo-plugin:
    name: RN Expo plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react-native
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: packages/react-native/.nvmrc

      # Skips the postinstall hook, which downloads release artifacts keyed off
      # a `checksums` field that only exists in the published package.json.
      - name: Install dependencies
        run: yarn --mode=skip-build

      - name: Build the Expo config plugin
        run: yarn plugin:build

      # A bare `@expo/config-plugins` require fails from Expo SDK 56 onward,
      # where the package is nested under `expo/` instead of hoisted.
      - name: Verify config-plugins is resolved through expo
        run: |
          if grep -rnE "(require\(|from )['\"]@expo/config-plugins(/|['\"])" plugin/build; then
            echo "::error::plugin/build must resolve config-plugins via 'expo/config-plugins'"
            exit 1
          fi

  state-snapshot:
    name: Itest state snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds only crates the itest jobs build, so it borrows their Rust cache
      # rather than adding one of its own.
      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          rust-cache-shared-key: itest
          rust-cache-save: 'false'

      # The key comes from the fixtures themselves rather than a list of paths
      # kept in step with them here. A cluster refuses a snapshot whose manifest
      # disagrees with it, and this is that same manifest, so the cache cannot
      # hold something the suites will then reject.
      - name: Work out which snapshot this tree needs
        id: snapshot
        run: |
          key=$(cargo run --quiet -p spark-itest --bin itest-bootstrap-snapshot-key)
          echo "key=itest-bootstrap-snapshot-${{ runner.os }}-$key" >> "$GITHUB_OUTPUT"

      - name: Restore the snapshot
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: crates/spark-itest/state-snapshot
          key: ${{ steps.snapshot.outputs.key }}

      - name: Build the snapshot
        if: steps.cache.outputs.cache-hit != 'true'
        run: make capture-itest-state

      - name: Cache the snapshot
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: crates/spark-itest/state-snapshot
          key: ${{ steps.snapshot.outputs.key }}

      - name: Hand the snapshot to the itest jobs
        uses: actions/upload-artifact@v4
        with:
          name: itest-state-snapshot
          path: crates/spark-itest/state-snapshot
          include-hidden-files: true
          overwrite: true
          retention-days: 1

  itest:
    name: Integration test (${{ matrix.backend.name }})
    runs-on: ubuntu-latest
    needs: state-snapshot
    continue-on-error: ${{ matrix.backend.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        backend:
          - { name: in-memory, target: itest,             allow-failure: false }
          - { name: postgres,  target: spark-itest-pg,    allow-failure: true }
          - { name: mysql,     target: spark-itest-mysql, allow-failure: true }
    env:
      FAUCET_USERNAME: ${{ secrets.FAUCET_USERNAME }}
      FAUCET_PASSWORD: ${{ secrets.FAUCET_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the state snapshot
        uses: actions/download-artifact@v4
        with:
          name: itest-state-snapshot
          path: crates/spark-itest/state-snapshot

      - name: Run Tests
        run: make ${{ matrix.backend.target }}

  compat-itest:
    name: Signer compatibility tests
    runs-on: ubuntu-latest
    needs: state-snapshot
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the state snapshot
        uses: actions/download-artifact@v4
        with:
          name: itest-state-snapshot
          path: crates/spark-itest/state-snapshot

      - name: Run cross-version signer tests
        run: make compat-itest

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Tests
        run: make cargo-test

      - name: Check git status
        uses: ./.github/actions/check-git-status

  breez-test:
    name: Breez integration tests
    runs-on: ubuntu-latest
    needs: state-snapshot
    env:
      FAUCET_USERNAME: ${{ secrets.FAUCET_USERNAME }}
      FAUCET_PASSWORD: ${{ secrets.FAUCET_PASSWORD }}
      FAUCET_CONCURRENCY: "2"  # Max concurrent faucet requests (rate limiting)
      RECOVERY_TEST_MNEMONIC: ${{ secrets.RECOVERY_TEST_MNEMONIC_V2 }}
      RECOVERY_TEST_EXPECTED_PAYMENTS: ${{ secrets.RECOVERY_TEST_EXPECTED_PAYMENTS_V2 }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore lnurl server image
        id: lnurl-image
        uses: ./.github/actions/lnurl-image-cache

      - name: Download the state snapshot
        uses: actions/download-artifact@v4
        with:
          name: itest-state-snapshot
          path: crates/spark-itest/state-snapshot

      - name: Run Tests
        run: make breez-itest

      - name: Export lnurl server image for caching
        if: steps.lnurl-image.outputs.cache-hit != 'true'
        run: |
          docker image inspect breez-lnurl-built:latest > /dev/null 2>&1 \
            && docker save breez-lnurl-built:latest -o /tmp/breez-lnurl-built.tar \
            || echo "lnurl image was not built in this run"

  cli-itest:
    name: Rust CLI binding tests
    runs-on: ubuntu-latest
    env:
      FAUCET_USERNAME: ${{ secrets.FAUCET_USERNAME }}
      FAUCET_PASSWORD: ${{ secrets.FAUCET_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore lnurl server image
        id: lnurl-image
        uses: ./.github/actions/lnurl-image-cache

      - name: Run CLI scenarios
        run: make cli-itest

      - name: Export lnurl server image for caching
        if: steps.lnurl-image.outputs.cache-hit != 'true'
        run: |
          docker image inspect breez-lnurl-built:latest > /dev/null 2>&1 \
            && docker save breez-lnurl-built:latest -o /tmp/breez-lnurl-built.tar \
            || echo "lnurl image was not built in this run"

  wasm-itest:
    name: WASM binding tests
    runs-on: ubuntu-latest
    env:
      FAUCET_USERNAME: ${{ secrets.FAUCET_USERNAME }}
      FAUCET_PASSWORD: ${{ secrets.FAUCET_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wasm-pack
        run: which wasm-pack || cargo install wasm-pack

      - name: Restore lnurl server image
        id: lnurl-image
        uses: ./.github/actions/lnurl-image-cache

      - name: Run WASM binding tests
        run: make wasm-itest

      - name: Export lnurl server image for caching
        if: steps.lnurl-image.outputs.cache-hit != 'true'
        run: |
          docker image inspect breez-lnurl-built:latest > /dev/null 2>&1 \
            && docker save breez-lnurl-built:latest -o /tmp/breez-lnurl-built.tar \
            || echo "lnurl image was not built in this run"

  wasm-clippy:
    name: Wasm clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Clippy
        run: make wasm-clippy-check

  wasm-test:
    name: Wasm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Tests
        run: make wasm-test

      - name: Check git status
        uses: ./.github/actions/check-git-status

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
      - run: flutter --version

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Initialize the workspace
        working-directory: packages/flutter
        run: just setup

      - name: Generate Dart/Flutter bindings & Check Rust package for errors
        working-directory: packages/flutter
        run: |
          just codegen
          cd rust && cargo check

      - name: Static Analysis
        working-directory: packages/flutter
        if: ${{ success() || failure() }}
        run: dart analyze --no-fatal-warnings lib

      - name: Check Formatting
        working-directory: packages/flutter
        run: dart format -o none --set-exit-if-changed -l 110 lib

      # This step is added to ensure version recipe was run to update podspec files & Gradle script.
      # It does not catch the case where 'packages/flutter/pubspec.yaml' wasn't updated properly.
      - name: Update version number on podspec files & Gradle scripts
        working-directory: packages/flutter
        run: just version

      - name: Check git status
        uses: ./.github/actions/check-git-status

      - name: CLI static analysis (flutter)
        working-directory: crates/breez-sdk/bindings/examples/cli
        run: make check-flutter

  cli:
    name: CLI
    uses: ./.github/workflows/cli-ci.yml
    secrets: inherit

  docs:
    name: Docs
    uses: ./.github/workflows/docs-ci.yml
    secrets: inherit
