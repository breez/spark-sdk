name: breez_cli
description: CLI client for Breez SDK with Spark (Dart/Flutter port)
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.10.0

dependencies:
  args: ^2.5.0
  bip39: ^1.0.6
  crypto: ^3.0.0
  breez_sdk_spark_flutter:
    path: ../../../../../../../packages/flutter

dev_dependencies:
  lints: ^5.1.1

# The build hook builds the SDK's native library from this checkout. A dev
# build is much faster to build than the release profile.
hooks:
  user_defines:
    breez_sdk_spark_flutter:
      cargo_profile: dev
