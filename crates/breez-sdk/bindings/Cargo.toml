[package]
name = "breez-sdk-spark-bindings"
edition = "2024"
version.workspace = true

[features]
default = ["postgres", "mysql"]
# PostgreSQL storage backend (disable for mobile builds to reduce binary size)
postgres = ["breez-sdk-spark/postgres"]
# MySQL storage backend (disable for mobile builds to reduce binary size)
mysql = ["breez-sdk-spark/mysql"]
# Exports the PostgreSQL and MySQL storage API without their backends, where
# calling it returns an error. For builds whose generated bindings are shared
# with libraries that include the backends.
db-storage-api = ["breez-sdk-spark/db-storage-api"]
uniffi-cli = ["uniffi/bindgen-tests", "uniffi/cli"]
# Bench-only: see breez-sdk-spark's `span-trace` feature.
span-trace = ["breez-sdk-spark/span-trace"]
# See breez-sdk-spark's `secp-lowmemory` feature.
secp-lowmemory = ["breez-sdk-spark/secp-lowmemory"]
# See breez-sdk-spark's `release-max-level-debug` feature.
release-max-level-debug = ["breez-sdk-spark/release-max-level-debug"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

[lib]
# Must match the package name: with no `lib` crate type, the React Native build (ubrn) derives the library file name from the package name.
name = "breez_sdk_spark_bindings"
# No `lib` here: cargo silently skips LTO when it is present.
crate-type = ["staticlib", "cdylib"]

[dependencies]
breez-sdk-spark = { workspace = true, features = ["uniffi", "passkey", "sqlite", "turnkey-p256"] }
uniffi = { workspace = true, features = ["tokio"] }

[build-dependencies]
glob.workspace = true
uniffi = { workspace = true, features = ["build"] }

[lints]
workspace = true
