dkg:
  min_available_keys: 100
knobs:
  # Static knobs apply because the entrypoint runs the operator with `-local`.
  static_values:
    # A full-size round (1000 keys) costs minutes of CPU when several clusters
    # run at once. Tests restore their keyshares from the state snapshot, so this
    # only bounds the cost of a replenishment round after a pool drains.
    spark.so.dkg.batch_size: 300
    # Cancels expired transfers every 5s rather than every minute, for tests that
    # wait on an expiry.
    spark.so.task.cancel_expired_transfers.interval_seconds: 5
    # The operator refuses to reserve an instant (0-conf) static deposit on a
    # network this knob does not enable.
    "spark.so.enable_instant_static_deposit@REGTEST": 1
    # By default the operator refuses a new deposit address to an owner holding 64
    # unused ones. Every node of a deposit tree holds one until the tree is
    # created, so the SSP's pool stocking reaches that.
    spark.so.max_unused_deposit_addresses: 100000
    # A rollout percentage (default 0) for BroadcastTokenTransaction, which the
    # SDK's token APIs call and the operator otherwise refuses as unimplemented.
    spark.so.tokens.token_transaction_v3_enabled: 100
    # Routes the SSP's counter transfer through the consensus flow, which fences a
    # swap's primary transfer on every operator rather than the coordinator alone.
    spark.so.use_consensus_initiate_counter_transfer: 1
bitcoind:
  regtest:
    network: regtest
    host: 127.0.0.1:8332
    rpcuser: rpcuser
    rpcpassword: rpcpassword
    zmqpubrawblock: tcp://127.0.0.1:28332
    # Tests confirm a deposit with a single block. The operator default is 3,
    # which no test mines up to, so a non-static deposit would never be marked
    # available.
    non_static_confirmation_threshold: 1
token:
  disconnect_lrc20_node: true
database:
  pool_min_conns: 4
  pool_max_conns: 32
  pool_max_conn_lifetime: 5m
  pool_max_conn_idle_time: 30s
  pool_health_check_period: 15s

lrc20:
  regtest:
    disablerpcs: true
    disablel1: true
    network: regtest
    host: 127.0.0.1:18530
    withdrawbondsats: 10000 # 0.01 BTC
    withdrawrelativeblocklocktime: 1000
    grpcpagesize: 200
    grpcpoolsize: 10
service_authz:
  mode: 1 # AuthzModeDisabled
  ip_allowlist: []
xff_client_ip_position: 0
return_detailed_errors: true
return_detailed_panic_errors: true
tracing:
  enabled: false
  otel_collector_endpoint: ""
  otel_collector_cert_path: ""
  global_sampling_rate: 0
  span_sampling_config:
    per_span_sampling_rates: {}
    allow_list: []
    block_list: []
