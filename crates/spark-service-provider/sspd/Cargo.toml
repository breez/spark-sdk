[package]
name = "sspd"
version.workspace = true
edition = "2024"

[[bin]]
name = "sspd"
path = "src/main.rs"

[lib]
name = "sspd_lib"
path = "src/lib.rs"

[lints]
workspace = true

[features]
test-utils = []

[dependencies]
lightning.workspace = true
tokio-stream = "0.1"
lightning-invoice.workspace = true
async-graphql.workspace = true
base64 = { workspace = true }
async-graphql-axum = "7.2"
async-trait = { workspace = true }
axum.workspace = true
bitcoin = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
deadpool-postgres = { workspace = true }
figment = { workspace = true, features = ["env", "toml"] }
futures = { workspace = true, features = ["alloc"] }
hex = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { workspace = true }
spark = { workspace = true }
frost-secp256k1-tr = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-postgres = { workspace = true, features = ["with-uuid-1"] }
tokio-postgres-rustls = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tonic = { workspace = true, features = ["transport", "tls", "codegen", "prost"] }
tower-http = { version = "0.6.6", features = ["cors"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
utils = { workspace = true }
uuid = { workspace = true }
webpki-roots = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["postgres"] }
tokio = { workspace = true, features = ["test-util"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
