[book]
language = "en"
src = "src"
title = "Breez SDK - Spark"

[output.html]
theme = "theme"
default-theme = "navy"
preferred-dark-theme = "navy"
additional-css = ["styles.css", "theme/pagetoc.css"]
additional-js = ["tabs.js", "theme/pagetoc.js", "brand-header.js"]
git-repository-url = "https://github.com/breez/spark-sdk"
edit-url-template = "https://github.com/breez/spark-sdk/edit/main/crates/breez-sdk/docs/{path}"
no-section-label = true

[output.html.fold]
enable = true

[output.html.print]
enable = false

[preprocessor.snippets]

[preprocessor.pagetoc]
command = "mdbook-pagetoc"
renderer = ["html"]

[preprocessor.variables.variables]
api_key_form_uri = "https://breez.technology/request-api-key/#contact-us-form-sdk"

# Markdown output (post-preprocessor) so each page is also published as .md,
# making the llms.txt links resolve and giving LLMs a clean-markdown version
[output.markdown]

# llmstxt.org index and the all-language corpus. Named `llms-index` so no
# renderer directory is called `llms`, which the editions create when the
# build output is flattened.
[output.llms-index]
command = "mdbook-llms"

# One corpus per language edition. Each renderer re-runs the snippets
# preprocessor, which reduces that pass to a single language.
[output.llms-rust]
command = "mdbook-llms"
[output.llms-swift]
command = "mdbook-llms"
[output.llms-kotlin]
command = "mdbook-llms"
[output.llms-csharp]
command = "mdbook-llms"
[output.llms-wasm]
command = "mdbook-llms"
[output.llms-react-native]
command = "mdbook-llms"
[output.llms-flutter]
command = "mdbook-llms"
[output.llms-python]
command = "mdbook-llms"
[output.llms-go]
command = "mdbook-llms"
