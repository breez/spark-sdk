<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>How the Breez SDK works</title>
  <desc>BTC over Lightning or on-chain, USDC or USDT on 30+ networks, or fiat through Cash App or MoonPay comes in. The Breez SDK holds it or bridges it in a non-custodial Spark wallet. It goes out as BTC, stablecoins, or fiat.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1b42"/>
      <stop offset="1" stop-color="#06102a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1a7cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1a7cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sdk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a92ff"/>
      <stop offset="1" stop-color="#0a72e6"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#7d8db0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="btc-logo">
      <path fill="#f7931a" d="m63.033,39.744c-4.274,17.143-21.637,27.576-38.782,23.301-17.138-4.274-27.571-21.638-23.295-38.78 4.272-17.145 21.635-27.579 38.775-23.305 17.144,4.274 27.576,21.64 23.302,38.784z"/>
      <path fill="#ffffff" d="m46.103,27.444c0.637-4.258-2.605-6.547-7.038-8.074l1.438-5.768-3.511-0.875-1.4,5.616c-0.923-0.23-1.871-0.447-2.813-0.662l1.41-5.653-3.509-0.875-1.439,5.766c-0.764-0.174-1.514-0.346-2.242-0.527l0.004-0.018-4.842-1.209-0.934,3.75s2.605,0.597,2.55,0.634c1.422,0.355,1.679,1.296,1.636,2.042l-1.638,6.571c0.098,0.025,0.225,0.061,0.365,0.117-0.117-0.029-0.242-0.061-0.371-0.092l-2.296,9.205c-0.174,0.432-0.615,1.08-1.609,0.834,0.035,0.051-2.552-0.637-2.552-0.637l-1.743,4.019,4.569,1.139c0.85,0.213,1.683,0.436,2.503,0.646l-1.453,5.834,3.507,0.875,1.439-5.772c0.958,0.26,1.888,0.5,2.798,0.726l-1.434,5.745,3.511,0.875,1.453-5.823c5.987,1.133,10.489,0.676,12.384-4.739,1.527-4.36-0.076-6.875-3.226-8.515,2.294-0.529,4.022-2.038,4.483-5.155zm-8.022,11.249c-1.085,4.36-8.426,2.003-10.806,1.412l1.928-7.729c2.38,0.594,10.012,1.77,8.878,6.317zm1.086-11.312c-0.99,3.966-7.1,1.951-9.082,1.457l1.748-7.007c1.982,0.494,8.365,1.416,7.334,5.55z"/>
    </g>
  </defs>

  <rect width="720" height="340" rx="16" fill="url(#bg)"/>
  <ellipse cx="360" cy="182" rx="190" ry="170" fill="url(#glow)"/>

  <text x="24" y="40" fill="#2f8cff" font-size="11" font-weight="700" letter-spacing="2">IN</text>
  <text x="500" y="40" fill="#2f8cff" font-size="11" font-weight="700" letter-spacing="2">OUT</text>

  <g id="cards-in">
    <rect x="24" y="56" width="196" height="76" rx="10" fill="#13254f" stroke="#2a3c66" stroke-width="1"/>
    <use href="#btc-logo" transform="translate(36 78) scale(0.5)"/>
    <text x="78" y="90" fill="#ffffff" font-size="16" font-weight="700">BTC</text>
    <text x="78" y="108" fill="#b9c5de" font-size="11.5">Lightning or on-chain</text>

    <rect x="24" y="144" width="196" height="76" rx="10" fill="#13254f" stroke="#2a3c66" stroke-width="1"/>
    <circle cx="52" cy="182" r="16" fill="#22c55e"/>
    <text x="52" y="188.5" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800">$</text>
    <text x="78" y="170" fill="#ffffff" font-size="16" font-weight="700">Stables</text>
    <text x="78" y="188" fill="#b9c5de" font-size="11.5">USDC or USDT</text>
    <text x="78" y="203" fill="#b9c5de" font-size="11.5">on 30+ networks</text>

    <rect x="24" y="232" width="196" height="76" rx="10" fill="#13254f" stroke="#2a3c66" stroke-width="1"/>
    <circle cx="52" cy="270" r="16" fill="#3a4870"/>
    <rect x="43" y="264" width="18" height="12" rx="2" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <circle cx="52" cy="270" r="2.6" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <text x="78" y="266" fill="#ffffff" font-size="16" font-weight="700">Fiat</text>
    <text x="78" y="284" fill="#b9c5de" font-size="11.5">Cash App or MoonPay</text>
  </g>

  <line x1="228" y1="94" x2="258" y2="94" stroke="#7d8db0" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="228" y1="182" x2="258" y2="182" stroke="#7d8db0" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="228" y1="270" x2="258" y2="270" stroke="#7d8db0" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="268" y="56" width="184" height="252" rx="14" fill="url(#sdk)"/>
  <text x="360" y="96" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800">Breez SDK</text>

  <rect x="280" y="138" width="66" height="92" rx="10" fill="#ffffff" fill-opacity="0.13" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1"/>
  <circle cx="313" cy="166" r="17" fill="#ffffff"/>
  <rect x="304" y="160" width="18" height="13" rx="2.5" fill="none" stroke="#1a7cff" stroke-width="1.8"/>
  <line x1="304" y1="164.5" x2="322" y2="164.5" stroke="#1a7cff" stroke-width="1.8"/>
  <line x1="315" y1="168.5" x2="319" y2="168.5" stroke="#1a7cff" stroke-width="1.8" stroke-linecap="round"/>
  <text x="313" y="211" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">Hold</text>

  <text x="360" y="188" text-anchor="middle" fill="#d2e6ff" font-size="12">or</text>

  <rect x="374" y="138" width="66" height="92" rx="10" fill="#ffffff" fill-opacity="0.13" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1"/>
  <circle cx="407" cy="166" r="17" fill="#ffffff"/>
  <path d="M400 162 H414 M410 158 L414 162 L410 166" fill="none" stroke="#1a7cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M414 170 H400 M404 166 L400 170 L404 174" fill="none" stroke="#1a7cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="407" y="211" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">Bridge</text>

  <g stroke="#d2e6ff" stroke-width="1.6" stroke-linecap="round">
    <line x1="283" y1="280" x2="283" y2="290"/>
    <line x1="278.7" y1="282.5" x2="287.3" y2="287.5"/>
    <line x1="278.7" y1="287.5" x2="287.3" y2="282.5"/>
  </g>
  <text x="293" y="289" fill="#d2e6ff" font-size="11">Spark wallet (non-custodial)</text>

  <line x1="462" y1="94" x2="492" y2="94" stroke="#7d8db0" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="462" y1="182" x2="492" y2="182" stroke="#7d8db0" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="462" y1="270" x2="492" y2="270" stroke="#7d8db0" stroke-width="1.3" marker-end="url(#arr)"/>

  <g id="cards-out">
    <rect x="500" y="56" width="196" height="76" rx="10" fill="#13254f" stroke="#2a3c66" stroke-width="1"/>
    <use href="#btc-logo" transform="translate(512 78) scale(0.5)"/>
    <text x="554" y="90" fill="#ffffff" font-size="16" font-weight="700">BTC</text>
    <text x="554" y="108" fill="#b9c5de" font-size="11.5">Lightning or on-chain</text>

    <rect x="500" y="144" width="196" height="76" rx="10" fill="#13254f" stroke="#2a3c66" stroke-width="1"/>
    <circle cx="528" cy="182" r="16" fill="#22c55e"/>
    <text x="528" y="188.5" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800">$</text>
    <text x="554" y="170" fill="#ffffff" font-size="16" font-weight="700">Stables</text>
    <text x="554" y="188" fill="#b9c5de" font-size="11.5">USDC or USDT</text>
    <text x="554" y="203" fill="#b9c5de" font-size="11.5">on 30+ networks</text>

    <rect x="500" y="232" width="196" height="76" rx="10" fill="#13254f" stroke="#2a3c66" stroke-width="1"/>
    <circle cx="528" cy="270" r="16" fill="#3a4870"/>
    <rect x="519" y="264" width="18" height="12" rx="2" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <circle cx="528" cy="270" r="2.6" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <text x="554" y="266" fill="#ffffff" font-size="16" font-weight="700">Fiat</text>
    <text x="554" y="284" fill="#b9c5de" font-size="11.5">Cash App or MoonPay</text>
